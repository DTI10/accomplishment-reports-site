# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

app_title: DTI Accomplishments CMS

backend:
  name: github
  repo: DTI10/accomplishment-reports-site
  branch: master
  squash_merges: true

# All content changes go through a pull request. Editors can save and mark
# entries as ready, but GitHub branch protection is what stops them from
# merging/publishing. Only admins can approve and merge.
publish_mode:
  type: editorial_workflow
  stages: [draft, pending_publish]
  direct_publish: false
  allow_incomplete_drafts: true

# Media is stored in public/media so Astro can serve it from /media/...
media_folder: public/media
public_folder: /media

collections:
  - name: articles
    label: Articles
    label_singular: Article
    folder: content/articles
    create: true
    slug: '{{slug}}'
    extension: md
    format: yaml-frontmatter
    identifier_field: title
    summary: '{{title}} — {{date}}'
    preview_path: '/articles/{{slug}}'
    sortable_fields:
      - date
      - title
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Date, name: date, widget: datetime, type: date }
      - {
          label: Description,
          name: description,
          widget: text,
          required: false,
          hint: Short summary shown on article cards and in search results.
        }
      - { label: Author, name: author, widget: string, required: false }
      - label: Program
        name: program
        widget: select
        required: false
        hint: The DTI program or project this story belongs to.
        options:
          - KMME
          - Shared Service Facility (SSF)
          - Pondo sa Pagbabago at Pag-asenso (P3)
          - RAPID Growth
          - Diskwento Caravan
          - Bagwis
          - Consumer Protection
          - Trade Facilitation
      - label: Province / Office
        name: province
        widget: select
        multiple: true
        required: false
        hint: Shown as a location badge on the home page. Pick one or more.
        options:
          - Regional Office
          - Bukidnon
          - Camiguin
          - Lanao del Norte
          - Misamis Occidental
          - Misamis Oriental
      - {
          label: Cover image,
          name: image,
          widget: image,
          required: false,
          hint: Displayed on cards and at the top of the article.
        }
      - {
          label: Cover image alt text,
          name: image_alt,
          widget: string,
          required: false,
          hint: Describe the image for screen readers. Defaults to the title.
        }
      - {
          label: Featured,
          name: featured,
          widget: boolean,
          default: false,
          hint: Pins this story to the home page hero.
        }
      - label: Event details
        name: event
        widget: object
        required: false
        collapsed: true
        hint: Fill in for events, trainings, or activities with a schedule.
        fields:
          - { label: Start, name: start, widget: datetime }
          - { label: End, name: end, widget: datetime, required: false }
          - { label: Venue, name: venue, widget: string, required: false }
          - {
              label: Registration link,
              name: registration_url,
              widget: string,
              required: false,
              hint: Full URL where readers can register.
            }
      - label: Gallery
        name: gallery
        widget: list
        required: false
        hint: Optional image carousel shown at the bottom of the article.
        summary: '{{fields.caption}}'
        fields:
          - { label: Image, name: image, widget: image }
          - { label: Caption, name: caption, widget: string, required: false }
      - label: Tags
        name: tags
        widget: select
        multiple: true
        required: false
        hint: Short topic labels used by the archive filters.
        options:
          - Trade
          - MSMEs
          - Consumer
          - Advisories
          - Programs
          - Events
          - Awards
          - Financing
      - label: Key figures
        name: stats
        widget: list
        required: false
        hint: Highlight numbers, e.g. beneficiaries or amount disbursed.
        summary: '{{fields.label}}: {{fields.value}}'
        fields:
          - { label: Label, name: label, widget: string }
          - { label: Value, name: value, widget: string }
      - {
          label: Partners,
          name: partners,
          widget: list,
          required: false,
          hint: Partner agencies, offices, or organizations.
        }
      - label: Attachments
        name: attachments
        widget: list
        required: false
        hint: Downloadable files such as press releases, MOAs, or reports.
        summary: '{{fields.title}}'
        fields:
          - { label: Title, name: title, widget: string }
          - { label: File, name: file, widget: file }
      - label: Contact
        name: contact
        widget: object
        required: false
        collapsed: true
        hint: Who readers can reach for more information.
        fields:
          - { label: Name, name: name, widget: string, required: false }
          - { label: Role, name: role, widget: string, required: false }
          - { label: Email, name: email, widget: string, required: false }
          - { label: Phone, name: phone, widget: string, required: false }
      - label: Related articles
        name: related
        widget: relation
        collection: articles
        search_fields: [title]
        display_fields: [title]
        multiple: true
        required: false
        filters:
          - field: slug
            values: ['{{slug}}']
            exclude: true
        hint: Pick other articles to show under "Read next".
      - {
          label: Body,
          name: body,
          widget: richtext,
          required: true,
          hint: Markdown content of the article.
        }

