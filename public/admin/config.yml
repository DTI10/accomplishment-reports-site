# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

app_title: DTI Accomplishments CMS

backend:
  name: github
  repo: DTI10/accomplishment-reports-site
  branch: master
  squash_merges: true

# Accomplishments use the Editorial Workflow, configured on the collection
# below: editors save a draft, mark it ready, and an admin merges the PR.
# Sveltia singletons always follow this top-level setting, so keeping it on
# "simple" means saving the Settings singleton commits straight to the
# configured branch (publishing immediately) instead of opening a PR. Branch
# protection + CODEOWNERS still limit who can push/merge settings.
publish_mode: simple

# Media is stored in public/media so Astro can serve it from /media/...
media_folder: public/media
public_folder: /media

# Shrink photos in the browser before they are saved. Phone photos are often 5-10 MB each, and an entry
# with several of them is sent to GitHub in one request that can be too large ("Failed to fetch").
# Photos larger than 2400px are scaled down (never up) and saved as WebP, usually 300-800 KB.
# `all` also applies the settings to external storage providers if one is added later; for the
# internal storage it can still be overridden under `default.config`.
media_libraries:
  all:
    transformations:
      # Any supported raster format (JPEG, PNG, HEIC, AVIF, ...) becomes WebP and is capped at 2400px.
      # Animated images are left untouched, and smaller images are never scaled up.
      raster_image:
        format: webp
        quality: 85
        width: 2400
        height: 2400
      # Strip comments and editor metadata from SVGs with SVGO.
      svg:
        optimize: true

collections:
  - name: articles
    label: Accomplishments
    label_singular: Accomplishment
    description: Saving creates a request to publish the item. Set the Status button at the top right to "Ready" to mark it as ready, an admin will review and publish it.
    folder: content/articles
    create: true
    slug: "{{slug}}"
    extension: md
    format: yaml-frontmatter
    identifier_field: title
    summary: "{{title}} — {{date}}"
    preview_path: "/articles/{{slug}}"
    sortable_fields:
      - date
      - title
    publish_mode:
      type: editorial_workflow
      stages: [draft, pending_publish]
      direct_publish: false
      allow_incomplete_drafts: true
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Date, name: date, widget: datetime, type: date }
      - label: Province / Office
        name: province
        widget: select
        required: false
        hint: Pick one. Shown as a location badge on the cards and pages.
        options:
          - Regional Office
          - Bukidnon
          - Camiguin
          - Lanao del Norte
          - Misamis Occidental
          - Misamis Oriental
      - {
          label: Main photo,
          name: image,
          widget: image,
          required: false,
          hint: "Landscape photo, about 1600px wide. Shown at the top of the story.",
        }
      - name: photos
        label: More photos
        label_singular: Photo
        widget: list
        required: false
        max: 4
        collapsed: false
        summary: '{{fields.size}}, {{fields.side}}'
        thumbnail: image
        hint: "Optional, up to 4. They are placed inside the text and alternate left and right."
        fields:
          - { name: image, label: Photo, widget: image }
          - name: caption
            label: Caption
            widget: string
            required: false
            hint: "Optional. Small grey text under the photo, e.g. Photo by Juan Dela Cruz."
          - name: size
            label: Size
            widget: select
            default: medium
            options:
              - { label: "Small", value: small }
              - { label: "Medium", value: medium }
              - { label: "Large", value: large }
              - { label: "Full width (no text beside it)", value: full }
          - name: side
            label: Side
            widget: select
            default: auto
            options:
              - { label: "Auto (alternate left and right)", value: auto }
              - { label: "Left", value: left }
              - { label: "Right", value: right }
          - name: after
            label: Place after paragraph
            widget: number
            value_type: int
            min: 0
            required: false
            hint: "Optional. Number of the paragraph to place this photo after (subheadings count as a paragraph). 0 = top of the text. Leave empty for automatic. A number larger than the text puts it at the end."
      - { label: Author, name: author, widget: string, required: false }
      - {
          label: Story text,
          name: body,
          widget: richtext,
          required: true,
          hint: "Write or paste the text here (pasting from Word or Google Docs is fine; it is cleaned on save). A line that is only bold text becomes a subheading. Add photos with the photo fields above, not inside the text."
        }
      - label: Programs
        name: programs
        widget: relation
        collection: programs
        multiple: true
        required: false
        value_field: "{{slug}}"
        display_fields: ["{{label}} — {{name}}"]
        search_fields: [label, name]
        hint: "Pick the program or programs this accomplishment belongs to. It then appears on each selected program's page. Leave empty if the story is not tied to a program."

  # Program pages such as SSF and RAPID (content/programs/<name>.md). Every entry gets its own page at
  # /programs/<name>/ and its own link in the Programs menu, so programs can be added, edited and deleted here.
  - name: programs
    label: Programs
    label_singular: Program
    description: Add or edit program pages such as SSF and RAPID, including their figure cards. Saving creates a request to publish the change. Set the Status button at the top right to "Ready" to mark it as ready, an admin will review and publish it.
    folder: content/programs
    create: true
    slug: "{{slug}}"
    extension: md
    format: yaml-frontmatter
    identifier_field: name
    summary: "{{name}}"
    preview_path: "/programs/{{slug}}"
    editor:
      preview: false
    publish_mode:
      type: editorial_workflow
      stages: [draft, pending_publish]
      direct_publish: false
      allow_incomplete_drafts: true
    fields:
      - { label: Page title, name: name, widget: string }
      - {
          label: Short name,
          name: label,
          widget: string,
          required: false,
          hint: "Used in the menu and the page heading, e.g. SSF. Also the tag that links accomplishments to this program. Leave empty to use the page title."
        }
      - {
          label: Menu order,
          name: order,
          widget: number,
          value_type: int,
          min: 1,
          required: false,
          hint: "Optional. Programs with a lower number come first in the menu."
        }
      - {
          label: Line under the title,
          name: tagline,
          widget: string,
          required: false,
          hint: "One short sentence shown in the top banner."
        }
      - {
          label: Banner photo,
          name: banner,
          widget: image,
          required: false,
          hint: "Optional. A landscape photo, 1600px wide or more, without a colour tint. It shows in greyscale behind the top banner."
        }
      - label: Figure cards
        name: stats
        label_singular: Card
        widget: list
        required: false
        max: 4
        collapsed: false
        summary: "{{fields.label}}: {{fields.value}}"
        hint: "Up to 4 cards shown under the About text. Add, edit, reorder or delete them here."
        fields:
          - {
              label: Title,
              name: label,
              widget: string,
              hint: "What the number counts, e.g. MSME beneficiaries."
            }
          - {
              label: Number,
              name: value,
              widget: string,
              hint: "Type it as it should appear, e.g. 1,250 or ₱12M or 6 of 6. It counts up on the page."
            }
          - {
              label: Short description,
              name: note,
              widget: string,
              required: false,
              hint: "Optional small line under the card, e.g. As of December 2025."
            }
      - {
          label: Dashboard report address,
          name: dashboard,
          widget: string,
          required: false,
          hint: "Optional. The address of a Looker Studio report (Share, then Embed report, then the part after src=). Leave empty to show no dashboard."
        }
      - {
          label: About text,
          name: body,
          widget: richtext,
          required: true,
          hint: "The text shown under About. A line that is only bold text becomes a subheading."
        }

# Site settings. Only admins are allowed to merge changes to this file via
# the branch protection + CODEOWNERS setup described in README.md.
singletons:
  - name: settings
    label: Settings
    file: content/settings/settings.yml
    icon: settings
    editor:
      preview: false
    fields:
      - label: Allow editors to publish automatically
        name: auto_publish
        widget: boolean
        default: false
        hint: >-
          When enabled, accomplishment pull requests marked as ready by an
          editor are auto-approved and merged without an admin. Settings changes
          still require an admin.
