# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

app_title: DTI Accomplishments CMS

backend:
  name: github
  repo: DTI10/accomplishment-reports-site
  branch: master
  squash_merges: true

# All content changes go through a pull request. Editors can save and mark
# entries as ready, but GitHub branch protection is what stops them from
# merging/publishing. Only admins can approve and merge.
publish_mode:
  type: editorial_workflow
  stages: [draft, pending_publish]
  direct_publish: false
  allow_incomplete_drafts: true

# Media is stored in public/media so Astro can serve it from /media/...
media_folder: public/media
public_folder: /media

# Shrink photos in the browser before they are saved. Phone photos are often 5-10 MB each, and an entry
# with several of them is sent to GitHub in one request that can be too large ("Failed to fetch").
# Photos larger than 2400px are scaled down (never up) and saved as WebP, usually 300-800 KB.
media_libraries:
  default:
    config:
      transformations:
        raster_image:
          format: webp
          quality: 85
          width: 2400
          height: 2400

collections:
  - name: articles
    label: Accomplishments
    label_singular: Accomplishment
    folder: content/articles
    create: true
    slug: '{{slug}}'
    extension: md
    format: yaml-frontmatter
    identifier_field: title
    summary: '{{title}} — {{date}}'
    preview_path: '/articles/{{slug}}'
    sortable_fields:
      - date
      - title
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Date, name: date, widget: datetime, type: date }
      - label: Province / Office
        name: province
        widget: select
        required: false
        hint: Pick one. Shown as a location badge on the cards and pages.
        options:
          - Regional Office
          - Bukidnon
          - Camiguin
          - Lanao del Norte
          - Misamis Occidental
          - Misamis Oriental
      - {
          label: Main photo,
          name: image,
          widget: image,
          required: false,
          hint: "Landscape photo, about 1600px wide. Shown at the top of the story.",
        }
      - name: photos
        label: More photos
        label_singular: Photo
        widget: list
        required: false
        max: 4
        collapsed: false
        summary: '{{fields.size}}, {{fields.side}}'
        thumbnail: image
        hint: "Optional, up to 4. They are placed inside the text and alternate left and right."
        fields:
          - { name: image, label: Photo, widget: image }
          - name: caption
            label: Caption
            widget: string
            required: false
            hint: "Optional. Small grey text under the photo, e.g. Photo by Juan Dela Cruz."
          - name: size
            label: Size
            widget: select
            default: medium
            options:
              - { label: "Small", value: small }
              - { label: "Medium", value: medium }
              - { label: "Large", value: large }
              - { label: "Full width (no text beside it)", value: full }
          - name: side
            label: Side
            widget: select
            default: auto
            options:
              - { label: "Auto (alternate left and right)", value: auto }
              - { label: "Left", value: left }
              - { label: "Right", value: right }
          - name: after
            label: Place after paragraph
            widget: number
            value_type: int
            min: 0
            required: false
            hint: "Optional. Number of the paragraph to place this photo after (subheadings count as a paragraph). 0 = top of the text. Leave empty for automatic. A number larger than the text puts it at the end."
      - { label: Author, name: author, widget: string, required: false }
      - {
          label: Story text,
          name: body,
          widget: richtext,
          required: true,
          hint: "Write or paste the text here (pasting from Word or Google Docs is fine; it is cleaned on save). A line that is only bold text becomes a subheading. Add photos with the photo fields above, not inside the text."
        }
      - label: Tags
        name: tags
        widget: select
        multiple: true
        required: false
        hint: Short topic labels used by the archive filters.
        options:
          - Trade
          - MSMEs
          - Consumer
          - Advisories
          - Programs
          - Events
          - Awards
          - Financing

  - name: news
    label: News
    label_singular: News item
    folder: content/news
    create: true
    slug: '{{slug}}'
    extension: md
    format: yaml-frontmatter
    identifier_field: title
    summary: '{{title}} — {{date}}'
    preview_path: '/news/{{slug}}'
    sortable_fields:
      - date
      - title
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Date, name: date, widget: datetime, type: date }
      - label: Province / Office
        name: province
        widget: select
        required: false
        hint: Pick one. Shown as a location badge on the cards and pages.
        options:
          - Regional Office
          - Bukidnon
          - Camiguin
          - Lanao del Norte
          - Misamis Occidental
          - Misamis Oriental
      - {
          label: Main photo,
          name: image,
          widget: image,
          required: false,
          hint: "Landscape photo, about 1600px wide. Shown at the top of the story.",
        }
      - name: photos
        label: More photos
        label_singular: Photo
        widget: list
        required: false
        max: 4
        collapsed: false
        summary: '{{fields.size}}, {{fields.side}}'
        thumbnail: image
        hint: "Optional, up to 4. They are placed inside the text and alternate left and right."
        fields:
          - { name: image, label: Photo, widget: image }
          - name: caption
            label: Caption
            widget: string
            required: false
            hint: "Optional. Small grey text under the photo, e.g. Photo by Juan Dela Cruz."
          - name: size
            label: Size
            widget: select
            default: medium
            options:
              - { label: "Small", value: small }
              - { label: "Medium", value: medium }
              - { label: "Large", value: large }
              - { label: "Full width (no text beside it)", value: full }
          - name: side
            label: Side
            widget: select
            default: auto
            options:
              - { label: "Auto (alternate left and right)", value: auto }
              - { label: "Left", value: left }
              - { label: "Right", value: right }
          - name: after
            label: Place after paragraph
            widget: number
            value_type: int
            min: 0
            required: false
            hint: "Optional. Number of the paragraph to place this photo after (subheadings count as a paragraph). 0 = top of the text. Leave empty for automatic. A number larger than the text puts it at the end."
      - { label: Author, name: author, widget: string, required: false }
      - {
          label: Story text,
          name: body,
          widget: richtext,
          required: true,
          hint: "Write or paste the text here (pasting from Word or Google Docs is fine; it is cleaned on save). A line that is only bold text becomes a subheading. Add photos with the photo fields above, not inside the text."
        }
      - label: Tags
        name: tags
        widget: select
        multiple: true
        required: false
        hint: Short topic labels used by the archive filters.
        options:
          - Trade
          - MSMEs
          - Consumer
          - Advisories
          - Programs
          - Events
          - Awards
          - Financing

# Site settings. Only admins are allowed to merge changes to this file via
# the branch protection + CODEOWNERS setup described in README.md.
singletons:
  - name: settings
    label: Settings
    file: content/settings/settings.yml
    icon: settings
    editor:
      preview: false
    fields:
      - label: Allow editors to publish automatically
        name: auto_publish
        widget: boolean
        default: false
        hint: >-
          When enabled, accomplishment and news pull requests marked as ready by an
          editor are auto-approved and merged without an admin. Settings changes
          still require an admin.
