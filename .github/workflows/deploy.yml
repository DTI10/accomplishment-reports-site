name: Deploy production

# Every merge to master (including admin reviews and the auto-publish
# workflow) produces a push event, which builds and deploys the site.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    # The production host runs the self-hosted runner, so the build happens
    # locally and is served by the Caddy reverse proxy from compose.yaml.
    runs-on: self-hosted
    environment: production
    timeout-minutes: 20

    env:
      SITE_ADDRESS: ${{ vars.SITE_ADDRESS || 'localhost' }}
      HTTP_PORT: ${{ vars.HTTP_PORT || '80' }}
      HTTPS_PORT: ${{ vars.HTTPS_PORT || '443' }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Build and start containers
        run: docker compose up -d --build --remove-orphans

      - name: Verify containers are running
        run: docker compose ps

      - name: Prune unused images
        run: docker image prune -f
