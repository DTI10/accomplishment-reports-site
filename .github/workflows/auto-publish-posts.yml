name: Auto-publish editor posts

# When the Settings toggle is on, merge article or news pull requests that an
# editor has marked as ready. Settings and code changes are never auto-merged.
on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: read

concurrency:
  group: auto-publish-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-publish:
    if: github.event.pull_request.draft == false && github.event.pull_request.merged == false
    runs-on: ubuntu-latest
    steps:
      - name: Check out the base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          sparse-checkout: content/settings/settings.yml

      - name: Read the auto-publish setting
        id: setting
        run: |
          value=$(sed -n 's/^auto_publish:[[:space:]]*//p' content/settings/settings.yml \
            | head -n1 | tr -d '\r"' | tr '[:upper:]' '[:lower:]')
          echo "enabled=$value" >> "$GITHUB_OUTPUT"

      - name: Check whether this PR qualifies
        id: check
        if: steps.setting.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          labels=$(gh pr view "$PR" --json labels --jq '[.labels[].name] | join(",")')
          if [[ ",$labels," != *",sveltia-cms/pending_publish,"* ]]; then
            echo "PR is not marked ready for publishing."
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          author=$(gh pr view "$PR" --json author --jq '.author.login')

          # Editors have Write access. Admins have Admin/Maintain access and
          # publish through the normal review flow instead of auto-publishing.
          permission=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$author/permission" --jq '.permission')
          if [ "$permission" != "write" ]; then
            echo "$author has '$permission' permission, not editor Write access."
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          files=$(gh pr diff "$PR" --name-only)
          if [ -z "$files" ]; then
            echo "PR has no file changes."
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          while IFS= read -r file; do
            case "$file" in
              content/articles/*|content/news/*|public/media/*) ;;
              *)
                echo "PR changes $file, which is outside the auto-publish allowlist."
                echo "eligible=false" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
            esac
          done <<< "$files"

          echo "eligible=true" >> "$GITHUB_OUTPUT"

      - name: Check for the admin token
        id: token
        if: steps.check.outputs.eligible == 'true'
        env:
          TOKEN: ${{ secrets.AUTO_PUBLISH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "AUTO_PUBLISH_TOKEN is not configured; skipping auto-merge."
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Approve and merge
        if: steps.token.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ secrets.AUTO_PUBLISH_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh pr review "$PR" --approve --body "Auto-approved: the auto-publish setting is enabled and this PR only changes articles or news." || true
          gh pr merge "$PR" --squash --admin --delete-branch
