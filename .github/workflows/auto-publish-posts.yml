name: Auto-publish editor posts

# When the Settings toggle is on, merge article or news pull requests that an
# editor has marked as ready. Settings and code changes are never auto-merged.
on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, ready_for_review]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to check
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write
  issues: read

concurrency:
  group: auto-publish-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

jobs:
  auto-publish:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.draft == false && github.event.pull_request.merged == false)
    runs-on: ubuntu-latest
    env:
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
    steps:
      - name: Validate the pull request number
        run: |
          if [ -z "$PR_NUMBER" ]; then
            echo "::error::No pull request number was provided."
            exit 1
          fi

      - name: Check out the base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
          sparse-checkout: content/settings/settings.yml

      - name: Read the auto-publish setting
        id: setting
        run: |
          value=$(sed -n 's/^auto_publish:[[:space:]]*//p' content/settings/settings.yml \
            | head -n1 | tr -d '\r"' | tr '[:upper:]' '[:lower:]')
          echo "enabled=$value" >> "$GITHUB_OUTPUT"
          {
            echo "## Auto-publish check"
            echo ""
            echo "- Pull request: #$PR_NUMBER"
            echo "- Setting: \`auto_publish: ${value:-<missing>}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check whether this PR qualifies
        id: check
        if: steps.setting.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          labels=$(gh pr view "$PR_NUMBER" --json labels --jq '[.labels[].name] | join(",")')
          if [[ ",$labels," != *",sveltia-cms/pending_publish,"* ]]; then
            echo "PR is not marked ready for publishing."
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "- Skipped: PR is not marked ready (\`sveltia-cms/pending_publish\`)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          author=$(gh pr view "$PR_NUMBER" --json author --jq '.author.login')

          # Editors have Write access. Admins have Admin/Maintain access and
          # publish through the normal review flow instead of auto-publishing.
          permission=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$author/permission" --jq '.permission')
          if [ "$permission" != "write" ]; then
            echo "$author has '$permission' permission, not editor Write access."
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "- Skipped: author \`$author\` has \`$permission\` permission, not editor Write access." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          files=$(gh pr diff "$PR_NUMBER" --name-only)
          if [ -z "$files" ]; then
            echo "PR has no file changes."
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "- Skipped: PR has no file changes." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          while IFS= read -r file; do
            case "$file" in
              content/articles/*|content/news/*|public/media/*) ;;
              *)
                echo "PR changes $file, which is outside the auto-publish allowlist."
                echo "eligible=false" >> "$GITHUB_OUTPUT"
                echo "- Skipped: PR changes \`$file\`, which is outside the allowlist." >> "$GITHUB_STEP_SUMMARY"
                exit 0
                ;;
            esac
          done <<< "$files"

          echo "eligible=true" >> "$GITHUB_OUTPUT"
          echo "- Eligible: editor PR with only article/news/media changes." >> "$GITHUB_STEP_SUMMARY"

      - name: Check for the admin token
        id: token
        if: steps.check.outputs.eligible == 'true'
        env:
          TOKEN: ${{ secrets.AUTO_PUBLISH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "AUTO_PUBLISH_TOKEN is not configured; skipping auto-merge."
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "- Skipped: \`AUTO_PUBLISH_TOKEN\` is not configured." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify the admin token
        if: steps.token.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ secrets.AUTO_PUBLISH_TOKEN }}
        run: |
          login=$(gh api user --jq '.login')
          permissions=$(gh api "repos/$GITHUB_REPOSITORY" --jq '.permissions')
          is_admin=$(gh api "repos/$GITHUB_REPOSITORY" --jq '.permissions.admin')

          echo "Token user: $login"
          echo "Repository permissions: $permissions"
          echo "- Admin token user: \`$login\` (\`$permissions\`)" >> "$GITHUB_STEP_SUMMARY"

          if [ "$is_admin" != "true" ]; then
            echo "::error::$login does not have admin access to $GITHUB_REPOSITORY. AUTO_PUBLISH_TOKEN must belong to a repository admin."
            exit 1
          fi

      - name: Approve and merge
        if: steps.token.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ secrets.AUTO_PUBLISH_TOKEN }}
        run: |
          gh pr review "$PR_NUMBER" --approve --body "Auto-approved: the auto-publish setting is enabled and this PR only changes articles or news." || true

          # Try a normal merge first. If branch protection blocks it, retry with
          # the admin bypass. The token owner must be a repository admin and the
          # token needs Pull requests: Read and write.
          if ! gh pr merge "$PR_NUMBER" --squash --delete-branch; then
            gh pr merge "$PR_NUMBER" --squash --admin --delete-branch
          fi

          echo "- Merged: PR #$PR_NUMBER was auto-published." >> "$GITHUB_STEP_SUMMARY"
